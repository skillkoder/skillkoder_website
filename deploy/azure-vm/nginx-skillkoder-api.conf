# SkillKoder API on the Azure VM — installed by bootstrap.sh as
# /etc/nginx/sites-available/skillkoder-api. certbot (enable-https.sh) adds
# the HTTPS server block and the http→https redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    # Two try-on photos of up to 10 MB each
    client_max_body_size 25m;

    location /static/ {
        alias /srv/skillkoder/app/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/skillkoder/app/backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/skillkoder/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Virtual Try-On generation takes ~65-100 s
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
}
