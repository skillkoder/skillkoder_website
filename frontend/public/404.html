<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SkillKoder</title>
    <script>
      // GitHub Pages SPA redirect
      // When GitHub Pages serves a 404 for a clean URL like /courses/data-analytics,
      // this page encodes the path into a query string and redirects to index.html,
      // which then restores the real URL using history.replaceState.
      // Source: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0; // 0 = custom domain at root (skillkoder.com)

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
