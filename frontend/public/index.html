    <!-- GitHub Pages SPA: restore path from query string set by 404.html -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            decoded[0] + (decoded[1] ? '?' + decoded[1] : '') + l.hash
          );
        }
      }(window.location));
    </script>
    <!--
      Organization entity for the whole site.

      @id gives every other schema block on the site a stable node to point at,
      instead of each page re-declaring an unrelated "SkillKoder" provider that
      Google has to guess is the same organisation.

      postalAddress matters specifically for the city pages: the SERP for
      "data analytics course in hyderabad" carries a local pack above the
      organic results. Schema alone does not put you in that pack — a verified
      Google Business Profile does — but a consistent name, address and phone
      across the site, the profile and directory listings is what lets Google
      treat them as the same business. Keep this address identical to the one
      on /privacy-policy, /terms and the Business Profile, character for
      character; a mismatch is worse than an omission.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "@id": "https://www.skillkoder.com/#organization",
      "name": "SkillKoder",
      "url": "https://www.skillkoder.com/",
