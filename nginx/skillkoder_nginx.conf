# ============================================================
# SkillKoder — Nginx Configuration for AWS EC2
# ============================================================
#
# Purpose:
#   1. Reverse-proxy /api/ and /admin/ to Gunicorn (Django) on port 8000
#   2. Serve /media/ images DIRECTLY from EC2 filesystem (NOT through Django)
#   3. Serve /static/ admin/DRF assets directly
#
# IMPORTANT — EC2 Persistence:
#   Images live on the EBS volume attached to your EC2 instance.
#   When you terminate an instance, choose "Keep Volume" to preserve images.
#   The default EBS behaviour in AWS DOES keep the root volume unless you
#   explicitly delete it or set "Delete on Termination = Yes".
#
# Deployment steps:
#   sudo cp skillkoder_nginx.conf /etc/nginx/sites-available/skillkoder
#   sudo ln -s /etc/nginx/sites-available/skillkoder /etc/nginx/sites-enabled/
#   sudo nginx -t        # test config
#   sudo systemctl reload nginx
# ============================================================


# Upstream — Gunicorn process running Django
upstream skillkoder_api {
    server 127.0.0.1:8000 fail_timeout=0;
}


# HTTP server (port 80) — redirect to HTTPS in production
# Remove / comment out this block if you're not using SSL yet
server {
    listen 80;
    server_name api.skillkoder.com YOUR_EC2_PUBLIC_IP;

    # Let's Encrypt ACME challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS once SSL is set up
    # Uncomment after running certbot:
    # return 301 https://$host$request_uri;

    # ---------------------------------------------------------------
    # Media files — served DIRECTLY by Nginx, NOT via Django/Gunicorn.
    # This is the key configuration that makes image serving fast and
    # ensures Django doesn't need to handle binary file streaming.
    # ---------------------------------------------------------------
    location /media/ {
        alias /var/www/skillkoder/media/;

        # Cache images in the browser for 30 days
        expires 30d;
        add_header Cache-Control "public, no-transform";

        # Security: block PHP/script execution inside media folder
        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }

        # Allow CORS for images requested by the GitHub Pages frontend
        add_header Access-Control-Allow-Origin "https://skillkoder.com";
    }

    # ---------------------------------------------------------------
    # Static files (Django admin CSS/JS, DRF browsable API)
    # Run: python manage.py collectstatic --noinput   before reloading
    # ---------------------------------------------------------------
    location /static/ {
        alias /var/www/skillkoder/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ---------------------------------------------------------------
    # API & Admin — forwarded to Gunicorn
    # ---------------------------------------------------------------
    location / {
        proxy_pass http://skillkoder_api;

        # Pass real client info to Django
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (future-proofing)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Max upload size for course images (10 MB)
        client_max_body_size 10M;
    }
}


